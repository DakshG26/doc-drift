[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-drift"
version = "1.0.0"
description = "Automated Documentation Drift Detection Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daksh Gupta" }]
dependencies = [
    "unidiff>=0.7.5",
    "markdown-it-py>=3.0.0",
    "requests>=2.31.0",
    "PyGithub>=2.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
